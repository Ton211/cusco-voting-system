<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password | CUSCO Voting System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="set-password" class="auth-hidden" style="min-height:100vh; display:flex; align-items:center; background:var(--bg);">

  <div class="center-card">
    <div class="center-logo mb-12">
      <img src="/images/cusco_logo.png" alt="CUSCO College crest" class="logo_img" width="96" height="96">
      <h1>CUSCO</h1>
      <p>Set Your Own Password</p>
    </div>

    <div class="alert alert-info">Welcome. You signed in with your adm number. Set your own private password to continue. Do not share it.</div>
    <div id="errorBox" class="error-box"></div>

    <form id="setPwForm" novalidate>
      <div class="form-group mb-12">
        <label for="newPassword">New password</label>
        <input class="input" type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="form-group mb-12">
        <label for="confirmPassword">Confirm new password</label>
        <input class="input" type="password" id="confirmPassword" placeholder="Repeat your new password" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" id="saveBtn" class="btn btn-primary" style="width:100%;">
        Save Password and Continue
      </button>
    </form>

    <div class="center mt-16">
      <a href="#" id="logoutLink" style="font-size:13px;">Log out</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/voter/set-password.js"></script>
</body>
</html>
