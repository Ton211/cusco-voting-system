<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>CUSCO Voting System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="public">
  <main class="auth-page">
    <div class="hero">
      <div class="center-logo mb-12">
        <img src="/images/cusco_logo.png" alt="CUSCO College crest" class="logo_img" width="96" height="96">
        <p>Voting System</p>
      </div>
      <div class="center-card" id="loginCard" style="margin-top:18px; text-align:left;">
        <div id="landingError" class="error-box" role="alert"></div>
        <form id="landingLoginForm" novalidate>
          <div class="form-group mb-12">
            <label for="landingAdm">Adm number</label>
            <input class="input" type="text" id="landingAdm" placeholder="e.g. ADM001" autocomplete="username">
          </div>
          <div class="form-group mb-12">
            <label for="landingPassword">Password</label>
            <input class="input" type="password" id="landingPassword" placeholder="Your password or adm number" autocomplete="current-password">
          </div>
          <button type="submit" id="landingLoginBtn" class="btn btn-primary w-full">Log In</button>
        </form>
        <div class="login-links">
          <a href="#" id="landingForgot" class="link">Forgot password?</a>
        </div>

        <div id="landingSetup" class="hidden" style="border-top:1px solid var(--border); margin-top:18px; padding-top:16px;">
          <p class="center text-sm" style="font-weight:700; margin-bottom:8px;">First time here? Set your password</p>
          <form id="landingSetupForm" novalidate>
            <div class="form-group mb-12">
              <label for="landingNewPassword">New password</label>
              <input class="input" type="password" id="landingNewPassword" placeholder="At least 6 characters" autocomplete="new-password" minlength="6">
            </div>
            <div class="form-group mb-12">
              <label for="landingConfirmPassword">Confirm password</label>
              <input class="input" type="password" id="landingConfirmPassword" placeholder="Repeat your new password" autocomplete="new-password" minlength="6">
            </div>
            <button type="submit" id="landingSetupBtn" class="btn btn-primary w-full">Register as a voter</button>
          </form>
        </div>
      </div>

    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/keyboard-avoid.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/landing.js"></script>
</body>
</html>
