<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results — CUSCO Voting System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="admin" class="auth-hidden">

  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand brand_with_logo"><img src="/images/cusco_logo.png" alt="CUSCO College crest" class="logo_img" width="34" height="34"><div class="brand_text">CUSCO<span>Voting System</span></div></div>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/students.html">Students</a>
        <a href="/admin/voters.html">Voters</a>
        <a href="/admin/candidates.html">Candidates</a>
        <a href="/admin/positions.html">Position</a>
        <a href="/admin/elections.html">Election</a>
        <a href="/admin/results.html">Results</a>
        <a href="/admin/users.html">Users</a>
      </nav>
      <div class="sidebar-user">
        <div id="sidebarName"></div>
        <button class="btn-logout" id="logoutBtn">Log Out</button>
      </div>
    </aside>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Election Results</h1>
          <p>Vote totals per position, plus turnout.</p>
        </div>
      </div>

      <div class="card">
        <div class="form-grid" style="grid-template-columns:2fr 1fr; align-items:end;">
          <div class="form-group">
            <label for="resultsElection">Election</label>
            <select class="input" id="resultsElection">
              <option value="">Select an election…</option>
            </select>
          </div>
          <div class="form-group">
            <label class="pill-toggle">
              <input type="checkbox" id="hideUntilClose">
              <span>Hide results until the election closes</span>
            </label>
          </div>
        </div>
      </div>

      <div id="resultsBody">
        <div class="empty">Select an election above to view results.</div>
      </div>
    </main>
  </div>

  <style>
    .pill-toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); cursor:pointer; }
    .pill-toggle input { accent-color: var(--primary); width:16px; height:16px; }
    .result-card { margin-bottom: 18px; }
    .result-row { margin-bottom: 14px; }
    .result-row .row-meta { display:flex; justify-content:space-between; font-size:14px; margin-bottom:4px; }
    .result-row .count { font-weight:700; color:var(--primary); }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>

  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/admin-common.js"></script>
  <script src="/js/admin/results.js"></script>
</body>
</html>
