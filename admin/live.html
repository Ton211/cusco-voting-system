<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live | CUSCO Voting System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="admin" class="auth-hidden">

  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand brand_with_logo"><img src="/images/cusco_logo.png" alt="CUSCO College crest" class="logo_img" width="34" height="34"><div class="brand_text">CUSCO<span>Voting System</span></div></div>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/students.html">Students</a>
        <a href="/admin/voters.html">Voters</a>
        <a href="/admin/candidates.html">Candidates</a>
        <a href="/admin/positions.html">Position</a>
        <a href="/admin/elections.html">Election</a>
        <a href="/admin/live.html">Live</a>
        <a href="/admin/results.html">Results</a>
        <a href="/admin/users.html">Users</a>
      </nav>
      <div class="sidebar-user">
        <div id="sidebarName"></div>
        <button class="btn-logout" id="logoutBtn">Log Out</button>
      </div>
    </aside>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Live Voting</h1>
          <p id="liveStatus">Checking for an open election...</p>
        </div>
        <span id="liveBadge"></span>
      </div>

      <div id="positionGrid"></div>

      <div class="card hidden" id="blankCard">
        <div class="empty">There is no open election right now.<br>Live graphs will appear here automatically once voting opens.</div>
      </div>
    </main>
  </div>

  <!-- Live graph modal -->
  <div class="modal" id="graphModal">
    <div class="modal-card">
      <h2 id="graphTitle">Position results</h2>
      <p class="muted text-sm mb-12" id="graphMeta"></p>
      <div id="graphBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close="graphModal">Close</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>


  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/admin-common.js"></script>
  <script src="/js/admin/live.js"></script>
</body>
</html>
