<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | CUSCO Voting System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="admin" class="auth-hidden">

  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand brand_with_logo"><img src="/images/cusco_logo.png" alt="CUSCO College crest" class="logo_img" width="34" height="34"><div class="brand_text">CUSCO<span>Voting System</span></div></div>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/students.html">Students</a>
        <a href="/admin/voters.html">Voters</a>
        <a href="/admin/candidates.html">Candidates</a>
        <a href="/admin/positions.html">Position</a>
        <a href="/admin/elections.html">Election</a>
        <a href="/admin/live.html">Live</a>
        <a href="/admin/results.html">Results</a>
        <a href="/admin/reports.html">Reports</a>
        <a href="/admin/users.html">Users</a>
      </nav>
      <div class="sidebar-user">
        <div id="sidebarName"></div>
        <button class="btn-logout" id="logoutBtn">Log Out</button>
      </div>
    </aside>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Election Report</h1>
          <p>Users &#8596; Results — turnout, winners and participation for one election.</p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;" class="no-print">
          <button class="btn btn-outline" id="printBtn" type="button">Print</button>
          <button class="btn btn-outline" id="csvSummaryBtn" type="button">Export summary CSV</button>
          <button class="btn btn-primary" id="csvVotersBtn" type="button">Export voters CSV</button>
        </div>
      </div>

      <div class="card">
        <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr; align-items:end;">
          <div class="form-group">
            <label for="reportElection">Election</label>
            <select class="input" id="reportElection">
              <option value="">Select an election…</option>
            </select>
          </div>
          <div class="form-group">
            <label for="filterVoted">Participation</label>
            <select class="input" id="filterVoted">
              <option value="all">All voters</option>
              <option value="voted">Voted only</option>
              <option value="not">Not voted only</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reportSearch">Search voters</label>
            <input class="input" type="search" id="reportSearch" placeholder="Adm, name…">
          </div>
        </div>
        <p class="muted text-sm" id="reportMeta">Select an election above to build the report.</p>
      </div>

      <div id="reportBody">
        <div class="empty">No report yet — pick an election.</div>
      </div>
    </main>
  </div>

  <style>
    @media print {
      .sidebar, .page-head .no-print, .card:first-of-type, .report-filters { display: none !important; }
      .admin-shell { display: block; }
      .content { padding: 0; }
      body { background: #fff; }
      .card, .stat { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    }
    .kv { display:grid; grid-template-columns: 190px 1fr; gap:4px 12px; font-size:14px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin:0; font-weight:600; }
    .report-filters { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>

  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/admin-common.js"></script>
  <script src="/js/admin/reports.js"></script>
</body>
</html>
