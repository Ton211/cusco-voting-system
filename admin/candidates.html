<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidates | CUSCO Voting System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="admin" class="auth-hidden">

  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand brand_with_logo"><img src="/images/cusco_logo.png" alt="CUSCO College crest" class="logo_img" width="34" height="34"><div class="brand_text">CUSCO<span>Voting System</span></div></div>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/students.html">Students</a>
        <a href="/admin/voters.html">Voters</a>
        <a href="/admin/candidates.html">Candidates</a>
        <a href="/admin/positions.html">Position</a>
        <a href="/admin/elections.html">Election</a>
        <a href="/admin/live.html">Live</a>
        <a href="/admin/results.html">Results</a>
        <a href="/admin/reports.html">Reports</a>
        <a href="/admin/users.html">Users</a>
      </nav>
      <div class="sidebar-user">
        <div id="sidebarName"></div>
        <button class="btn-logout" id="logoutBtn">Log Out</button>
      </div>
    </aside>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Candidates</h1>
        </div>
        <button class="btn btn-primary" id="openRegisterBtn">+ Register Candidate</button>
      </div>

      <div class="card">
        <div class="card-title" style="justify-content:flex-end;">
          <span class="search-box">
            <input class="input" type="search" id="searchBox" placeholder="Search…">
          </span>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Photo</th>
                <th>Name</th>
                <th>Position</th>
                <th>Election</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="candidatesTableBody"></tbody>
          </table>
          <div class="empty hidden" id="emptyState">
            No candidates yet. <button class="btn btn-outline btn-sm" id="emptyRegisterBtn">+ Register Candidate</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Candidate modal (register + edit) -->
  <div class="modal" id="candidateModal">
    <div class="modal-card">
      <h2 id="candidateModalTitle">Register Candidate</h2>
      <form id="candidateForm">
        <input type="hidden" id="candDocId">
        <div class="form-grid">
          <div class="form-group full">
            <label for="candElection">Election</label>
            <select class="input" id="candElection" required>
              <option value="">Select election…</option>
            </select>
          </div>
          <div class="form-group full">
            <label for="candPosition">Position</label>
            <select class="input" id="candPosition" required>
              <option value="">Select position…</option>
            </select>
          </div>
          <div class="form-group full">
            <label for="candName">Candidate Name</label>
            <input class="input" id="candName" required>
          </div>
          <div class="form-group full">
            <label for="candPhoto">Photo</label>
            <input class="input" type="file" id="candPhoto" accept="image/*">
            <p class="muted" style="font-size:12px; margin-top:4px;">Optional. PNG/JPG, max 2 MB.</p>
          </div>
          <div class="form-group full">
            <label for="candStatus">Status</label>
            <select class="input" id="candStatus">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close="candidateModal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="candSubmitBtn">Save Candidate</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>

  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/admin-common.js"></script>
  <script src="/js/admin/candidates.js"></script>
</body>
</html>
