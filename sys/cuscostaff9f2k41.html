<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff Portal | CUSCO Voting System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="admin-login">
  <main class="auth-page">
  <div class="center-card">
    <div class="center-logo mb-12">
      <img src="/images/cusco_logo.png" alt="CUSCO College crest" class="logo_img" width="96" height="96">
      <h1>CUSCO</h1>
      <p>Staff Portal</p>
    </div>

    <div id="noticeBox" class="info-box hidden"></div>
    <div id="errorBox" class="error-box" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group mb-12">
        <label for="email">Staff username or email</label>
        <input class="input" type="text" id="email" name="username" placeholder="Staff username" autocomplete="username" required>
      </div>

      <div class="form-group mb-12">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary w-full">
        Sign In
      </button>
    </form>

    <div class="login-links">
      <a href="#" id="forgotLink" class="link">Forgot password?</a>
    </div>
    <p class="auth-note">Restricted area. Staff accounts only.</p>
  </div>
  </main>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>

  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/portal.js"></script>
</body>
</html>
