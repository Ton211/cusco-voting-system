<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Log In | CUSCO Online Voting System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
  <main class="auth-page">
  <div class="center-card">
    <div class="center-logo mb-12">
      <img src="/images/cusco_logo.png" alt="CUSCO College crest" class="logo_img" width="96" height="96">
      <h1>CUSCO</h1>
      <p>Online Voting System</p>
    </div>

    <div id="errorBox" class="error-box" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group mb-12">
        <label for="email">Adm number</label>
        <input class="input" type="text" id="email" name="username" placeholder="e.g. ADM001" autocomplete="username" required>
        <p class="auth-note" style="text-align:left;">First login: enter your adm number and press Log In, then set your own password below.</p>
      </div>

      <div class="form-group mb-12">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" name="password" placeholder="Your password or adm number" autocomplete="current-password" required>
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary w-full">
        Log In
      </button>
    </form>

    <div class="login-links" id="loginLinks">
      <a href="#" id="forgotLink" class="link">Forgot password?</a>
    </div>

    <div id="firstSetup" class="hidden" style="border-top:1px solid var(--border); margin-top:18px; padding-top:16px;">
      <p class="center text-sm" style="font-weight:700; margin-bottom:8px;">First time here? Set your password</p>
      <form id="setupForm" novalidate>
        <div class="form-group mb-12">
          <label for="newPassword">New password</label>
          <input class="input" type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password" minlength="6">
        </div>
        <div class="form-group mb-12">
          <label for="confirmPassword">Confirm password</label>
          <input class="input" type="password" id="confirmPassword" placeholder="Repeat your new password" autocomplete="new-password" minlength="6">
        </div>
        <button type="submit" id="setupRegisterBtn" class="btn btn-primary w-full">
          Change Password
        </button>
      </form>
      <div class="center mt-16">
        <button class="btn btn-ghost btn-sm" id="setupBackBtn" type="button">Back to log in</button>
      </div>
    </div>
  </div>
  </main>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>

  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/keyboard-avoid.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
